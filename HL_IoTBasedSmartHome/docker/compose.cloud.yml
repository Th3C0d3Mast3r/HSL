name: homelab-cloud-service

networks:
  homelab-network:
    external: true

services:
  nextcloud:
    image: nextcloud:latest
    container-name: homelab-nextcloud
    restart: unless-stopped
    user: ${PUID}:${PGID}
    ports:
      - 8080:80
    environment: 
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD:-sikeThatsTheWrongNumber}
    volumes:
      - ${DATA_ROOT}/nextcloud/html:/var/www/html
      - ${CLOUD_ROOT}:/var/www/html/data
    networks:
      - homelab-network