name: homelab-cameras

networks:
  homelab-net:
    external: true

services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: frigate
    privileged: true
    restart: unless-stopped
    shm_size: "64mb"
    ports:
      - "${FRIGATE_PORT:-5000}:5000"
      - "8554:8554" # RTSP feeds
      - "8555:8555/tcp" # WebRTC
      - "8555:8555/udp" # WebRTC
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ../configs/frigate/config.yml:/config/config.yml
      - ${CAMERA_ROOT}:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 100000000
    networks:
      - homelab-net